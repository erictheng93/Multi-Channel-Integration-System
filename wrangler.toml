# Multi-Channel Customer Support System - Unified Configuration
# Consolidates both main and WebSocket functionality
name = "multi-channel-platform"
main = "src/index.ts"
compatibility_date = "2025-07-31"
compatibility_flags = ["nodejs_compat"]

# Default production variables
[vars]
ENVIRONMENT = "production"
R2_PUBLIC_URL = "https://s3.imfinethankyouandyou.com"

# Production routes
[[routes]]
pattern = "multi-channel.imfinethankyouandyou.com/*"
zone_name = "imfinethankyouandyou.com"

# Observability
[observability]
enabled = true

# 生產環境 D1 資料庫
[[d1_databases]]
binding = "DB"
database_name = "multi-channel-platform"
database_id = "08ae6790-2494-40a8-a07a-df3920783159"
migrations_dir = "migrations"

# 生產環境 KV Namespaces
[[kv_namespaces]]
binding = "SESSIONS"
id = "ace3f7202e6a4dd8b98c50e9b91b2431"
preview_id = "ace3f7202e6a4dd8b98c50e9b91b2431"

[[kv_namespaces]]
binding = "CACHE"
id = "f3bc7a55c8a14f4fb28b8321fa01dc73"
preview_id = "f3bc7a55c8a14f4fb28b8321fa01dc73"

# 生產環境 R2 存儲
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "multi-channel-platform-attachments"
preview_bucket_name = "multi-channel-platform-attachments"

# 生產環境 Queue - 代理延遲消息處理
# ⚠️ DEPRECATED: 延遲訊息已遷移到 Durable Objects (DelayedMessageBuffer)
# 保留此配置僅用於向後兼容，未來版本將移除
[[queues.producers]]
binding = "AGENT_QUEUE"
queue = "agent-queue"

[[queues.consumers]]
queue = "agent-queue"
max_batch_size = 10
max_batch_timeout = 5

# Real-time events queue
[[queues.producers]]
binding = "REALTIME_QUEUE"
queue = "realtime-events"

[[queues.consumers]]
queue = "realtime-events"
max_batch_size = 5
max_batch_timeout = 1

# =================== DURABLE OBJECTS (WebSocket) ===================

# ConversationRoom - Manages WebSocket connections per conversation
[[durable_objects.bindings]]
name = "CONVERSATION_ROOM"
class_name = "ConversationRoom"

# UserConnection - Manages user presence and subscriptions
[[durable_objects.bindings]]
name = "USER_CONNECTION"
class_name = "UserConnection"

# MessageBroadcaster - Intelligent event distribution and broadcasting
[[durable_objects.bindings]]
name = "MESSAGE_BROADCASTER"
class_name = "MessageBroadcaster"

# DelayedMessageProcessor - Batch processing for scheduled messages
[[durable_objects.bindings]]
name = "DELAYED_MESSAGE_PROCESSOR"
class_name = "DelayedMessageProcessor"

# DelayedMessageBuffer - Instant-cancel undo buffer for agent messages
[[durable_objects.bindings]]
name = "DELAYED_MESSAGE_BUFFER"
class_name = "DelayedMessageBuffer"

# DistributedLock - Cross-Durable Object coordination and locking
[[durable_objects.bindings]]
name = "DISTRIBUTED_LOCK"
class_name = "LockCoordinator"

# =================== DURABLE OBJECTS MIGRATIONS ===================

# Initial migration - Original Durable Objects
[[migrations]]
tag = "v1"
new_classes = [
  "ConversationRoom",
  "UserConnection",
  "MessageBroadcaster",
  "DelayedMessageProcessor",
  "LockCoordinator"
]

# Migration v2 - Add DelayedMessageBuffer
[[migrations]]
tag = "v2"
new_classes = ["DelayedMessageBuffer"]

# Development environment
[env.development]
name = "multi-channel-platform-dev"

[env.development.vars]
ENVIRONMENT = "development"
R2_PUBLIC_URL = "http://localhost:8787"

# Development resources (inherit from production but with dev IDs)
[[env.development.d1_databases]]
binding = "DB"
database_name = "multi-channel-platform-dev"
database_id = "dev-database-id-placeholder"

[[env.development.kv_namespaces]]
binding = "SESSIONS"
id = "dev-sessions-kv-placeholder"

[[env.development.kv_namespaces]]
binding = "CACHE"
id = "dev-cache-kv-placeholder"

