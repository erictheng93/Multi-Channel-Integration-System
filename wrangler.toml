# Multi-Channel Customer Support System - Unified Configuration
# Account: admin@dacit.net (account_id via CLOUDFLARE_ACCOUNT_ID env var)
name = "mcis-worker"
main = "src/index.ts"
compatibility_date = "2025-10-27"
compatibility_flags = ["nodejs_compat"]

# Default production variables
# ⚠️ IMPORTANT: The following URLs must be configured for production deployment
[vars]
ENVIRONMENT = "production"
# LINE OA Basic ID for QR Code generation
LINE_BOT_ID = "@212kjcbd"
# LIFF ID for team QR Code onboarding
LINE_LIFF_ID = "2007743547-EnXG6puw"

# ============================================================================
# CORS Configuration (Required for cross-origin requests)
# ============================================================================
# Frontend URL - Your main frontend domain
FRONTEND_URL = "https://mcis.daiwandist.com"
# Backend URL - Your API/Worker domain
BACKEND_URL = "https://mcis-backend.daiwandist.com"
# R2 Storage Public URL - For file access
STORAGE_PUBLIC_URL = "https://s3.daiwandist.com"
# Logging Configuration (P2-6)
# Options: "debug" | "info" | "warn" | "error" | "fatal" | "silent"
# - debug: All logs (development only)
# - info: General info + warnings + errors (default for production)
# - warn: Warnings + errors only
# - error: Errors only
# - silent: No console output
LOG_LEVEL = "info"

# 🆕 Presigned URL Configuration (Direct Upload to R2)
# R2_ACCOUNT_ID and R2_BUCKET_NAME are stored as secrets (wrangler secret put)

# Production routes
# ⚠️ Configure these routes based on your domain setup
# [[routes]]
# pattern = "mcis-backend.daiwandist.com/*"
# zone_name = "daiwandist.com"

# Observability
[observability]
enabled = true

# =================== CRON TRIGGERS ===================
# Task Reminder Processing - Runs every 5 minutes to check for due reminders
# Calls the scheduled() handler in src/index.ts
[triggers]
crons = ["*/5 * * * *"]

# 生產環境 D1 資料庫
[[d1_databases]]
binding = "DB"
database_name = "mcis-db"
database_id = "1ea20f0e-a053-41a2-b53b-bafa014203b7"
migrations_dir = "migrations"

# 生產環境 KV Namespaces
[[kv_namespaces]]
binding = "SESSIONS"
id = "d9398c4c82184d20833b48cd26db1b38"
preview_id = "d9398c4c82184d20833b48cd26db1b38"

[[kv_namespaces]]
binding = "CACHE"
id = "a8e949aee74a423bbbf4db713be54b67"
preview_id = "a8e949aee74a423bbbf4db713be54b67"

# 生產環境 R2 存儲
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "mcis-files"
preview_bucket_name = "mcis-files"

# ⚠️ REMOVED: AGENT_QUEUE has been fully deprecated and removed (2025-10-07)
# Delayed messages are now handled by DelayedMessageBuffer Durable Object
# Migration completed: 2025-09-30
# See: docs/reports/migration/MIGRATION_TO_DURABLE_OBJECTS_COMPLETE.md

# ⚠️ REMOVED: REALTIME_QUEUE has been fully deprecated and removed (Phase 2: 2025-10-17)
# Real-time events are now handled by Durable Objects (MessageBroadcaster, ConversationRoom)
# Latest message cache updates are handled by LatestMessageCacheCoordinator Durable Object
# Migration completed: Phase 1.4b (2025-10-17)

# =================== LINE MESSAGE QUEUE (Phase 3) ===================
# Async LINE outbound message delivery (Workers Paid Plan enabled)

[[queues.producers]]
queue = "line-message-queue"
binding = "LINE_MESSAGE_QUEUE"

[[queues.consumers]]
queue = "line-message-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "line-message-dlq"

[[queues.producers]]
queue = "line-message-dlq"
binding = "LINE_MESSAGE_DLQ"

# =================== DURABLE OBJECTS (WebSocket) ===================

# ConversationRoom - Manages WebSocket connections per conversation
[[durable_objects.bindings]]
name = "CONVERSATION_ROOM"
class_name = "ConversationRoom"

# UserConnection - Manages user presence and subscriptions
[[durable_objects.bindings]]
name = "USER_CONNECTION"
class_name = "UserConnection"

# MessageBroadcaster - Intelligent event distribution and broadcasting
[[durable_objects.bindings]]
name = "MESSAGE_BROADCASTER"
class_name = "MessageBroadcaster"

# DelayedMessageBuffer - Delayed message scheduling with Alarm API
[[durable_objects.bindings]]
name = "DELAYED_MESSAGE_SCHEDULER"
class_name = "DelayedMessageBuffer"

# DistributedLock - Cross-Durable Object coordination and locking
[[durable_objects.bindings]]
name = "DISTRIBUTED_LOCK"
class_name = "LockCoordinator"

# LatestMessageCacheCoordinator - Batch cache updates via alarm (replaces REALTIME_QUEUE)
[[durable_objects.bindings]]
name = "LATEST_MESSAGE_COORDINATOR"
class_name = "LatestMessageCacheCoordinator"

# =================== NEW: CUSTOMER CONVERSATION SYSTEM (Chat-Style) ===================
# CustomerConversationDO - Simplified WebSocket management for customer conversations
# Inspired by Chat Project's AuthorizationDurableObject
[[durable_objects.bindings]]
name = "CUSTOMER_CONVERSATION_DO"
class_name = "CustomerConversationDO"

# CustomerMessageDO - Message operations and R2 file uploads
# Inspired by Chat Project's ConversationDurableObject
[[durable_objects.bindings]]
name = "CUSTOMER_MESSAGE_DO"
class_name = "CustomerMessageDO"

# =================== KV OPTIMIZATION: RATE LIMITER DO ===================
# RateLimiterDO - Replaces KV-based rate limiting for 95%+ write reduction
# Uses in-memory sliding window with periodic batch persistence
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

# MetricsCollector - Aggregates API request metrics in memory
[[durable_objects.bindings]]
name = "METRICS_COLLECTOR"
class_name = "MetricsCollectorDO"

# =================== DURABLE OBJECTS MIGRATIONS ===================

# Initial migration - Original Durable Objects (v1 - DO NOT MODIFY!)
[[migrations]]
tag = "v1"
new_classes = [
  "ConversationRoom",
  "UserConnection",
  "MessageBroadcaster",
  "DelayedMessageProcessor",
  "LockCoordinator"
]

# Migration v2 - Add DelayedMessageBuffer (v2 - DO NOT MODIFY!)
[[migrations]]
tag = "v2"
new_classes = ["DelayedMessageBuffer"]

# Migration v3 - Add LatestMessageCacheCoordinator (NEW)
[[migrations]]
tag = "v3"
new_classes = ["LatestMessageCacheCoordinator"]

# Migration v4 - Add Customer Conversation System (NEW)
# Adds simplified WebSocket architecture for customer conversations
[[migrations]]
tag = "v4"
new_classes = [
  "CustomerConversationDO",
  "CustomerMessageDO"
]

# Migration v5 - Add RateLimiterDO for KV optimization
# Reduces KV write operations by 95%+ for rate limiting
# Note: Using new_sqlite_classes for free plan compatibility
[[migrations]]
tag = "v5"
new_sqlite_classes = ["RateLimiterDO"]

# Migration v6 - Add MetricsCollectorDO for real API metrics
[[migrations]]
tag = "v6"
new_classes = ["MetricsCollectorDO"]

# =================== DEPLOYMENT ENVIRONMENT POLICY ===================
#
# ⚠️ THIS PROJECT USES PRODUCTION ENVIRONMENT ONLY (REMOTE RESOURCES)
#
# This project does NOT use local development resources.
# All development and deployment connects to REMOTE production resources.
#
# Development:
#   - Use `bun run dev` or `wrangler dev --remote`
#   - Connects to REMOTE D1, KV, R2, and Durable Objects
#   - All changes affect production data - use with caution
#
# Production Deployment:
#   - Use `wrangler deploy` or `bun run deploy`
#   - Deploys to production resources defined above
#   - Domain: mcis-backend.daiwandist.com (Worker), mcis.daiwandist.com (Pages)
#
# Database Operations:
#   - `bun run db:migrate` - Apply migrations to REMOTE D1
#   - `bun run db:query` - Query REMOTE D1 database
#   - `bun run db:studio` - Open Drizzle Studio for REMOTE DB
#
# Health Checks:
#   - `bun run health:check:all` - Check system and WebSocket health
#   - `bun run health:check:detail` - Detailed WebSocket health
#   - `bun run monitor:deployment` - Continuous health monitoring
#
# DO NOT add [env.development] or [env.staging] sections.
# This project operates directly on production resources.
#
# ======================================================================
