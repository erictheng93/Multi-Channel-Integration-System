# 檔案路徑: ./wrangler.toml
# 專案名稱: multi-channel-platform
# Created by: Assistant

# 生產環境 Worker 配置
name = "multi-channel-platform"
main = "src/index.ts"
compatibility_date = "2025-07-31"
compatibility_flags = ["nodejs_compat"]

# 生產環境變數
[vars]
ENVIRONMENT = "production"
R2_PUBLIC_URL = "https://s3.imfinethankyouandyou.com"

# 生產環境路由
[[routes]]
pattern = "multi-channel.imfinethankyouandyou.com/*"
zone_name = "imfinethankyouandyou.com"

# 觀察性設置
[observability.logs]
enabled = true

# 生產環境 D1 資料庫
[[d1_databases]]
binding = "DB"
database_name = "multi-channel-platform"
database_id = "08ae6790-2494-40a8-a07a-df3920783159"
migrations_dir = "migrations"

# 生產環境 KV Namespaces
[[kv_namespaces]]
binding = "SESSIONS"
id = "ace3f7202e6a4dd8b98c50e9b91b2431"
preview_id = "ace3f7202e6a4dd8b98c50e9b91b2431"

[[kv_namespaces]]
binding = "CACHE"
id = "f3bc7a55c8a14f4fb28b8321fa01dc73"
preview_id = "f3bc7a55c8a14f4fb28b8321fa01dc73"

# 生產環境 R2 存儲
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "multi-channel-platform-attachments"
preview_bucket_name = "multi-channel-platform-attachments"

# 生產環境 Queue
[[queues.producers]]
binding = "MESSAGE_QUEUE"
queue = "message-queue"

[[queues.consumers]]
queue = "message-queue"
max_batch_size = 10
max_batch_timeout = 5

