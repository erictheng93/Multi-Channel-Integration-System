# 檔案路徑: ./wrangler.toml
# 專案名稱: multi-channel-platform
# Created by: Assistant

# 生產環境 Worker 配置
name = "multi-channel-platform"
main = "src/index.ts"
compatibility_date = "2025-07-31"
compatibility_flags = ["nodejs_compat"]

# 生產環境變數
[vars]
ENVIRONMENT = "production"
R2_PUBLIC_URL = "https://s3.imfinethankyouandyou.com"
ENCRYPTION_KEY = "production-encryption-key-change-me"
JWT_SECRET = "your-super-secret-jwt-key-change-this-in-production"

# 生產環境路由
[[routes]]
pattern = "multi-channel.imfinethankyouandyou.com/*"
zone_name = "imfinethankyouandyou.com"

# 觀察性設置
[observability.logs]
enabled = true

# 生產環境 D1 資料庫
[[d1_databases]]
binding = "DB"
database_name = "multi-channel-platform"
database_id = "08ae6790-2494-40a8-a07a-df3920783159"
migrations_dir = "migrations"

# 生產環境 KV Namespaces
[[kv_namespaces]]
binding = "SESSIONS"
id = "ace3f7202e6a4dd8b98c50e9b91b2431"

[[kv_namespaces]]
binding = "CACHE"
id = "f3bc7a55c8a14f4fb28b8321fa01dc73"

# 生產環境 R2 存儲
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "multi-channel-platform-attachments"

# 生產環境 Queue
[[queues.producers]]
binding = "MESSAGE_QUEUE"
queue = "message-queue"

[[queues.consumers]]
queue = "message-queue"
max_batch_size = 10
max_batch_timeout = 5

# =====================================
# 開發環境配置 - 獨立的 Worker
# =====================================
[env.dev]
name = "multi-channel-platform-dev"

# 開發環境專用路由
[[env.dev.routes]]
pattern = "multi-channel-dev.imfinethankyouandyou.com/*"
zone_name = "imfinethankyouandyou.com"

# 開發環境變數
[env.dev.vars]
ENVIRONMENT = "development"
R2_PUBLIC_URL = "https://s3-dev.imfinethankyouandyou.com"
ENCRYPTION_KEY = "dev-encryption-key-32-char-long"
JWT_SECRET = "dev-jwt-secret-key-for-development-only"

# 開發環境 D1 資料庫
[[env.dev.d1_databases]]
binding = "DB"
database_name = "multi-channel-platform-dev"
database_id = "3b7339f0-80de-49dc-b079-312df4a4c316"

# 開發環境 KV Namespaces
[[env.dev.kv_namespaces]]
binding = "SESSIONS"
id = "e7687b9663cb492aa398a29b29956128"

[[env.dev.kv_namespaces]]
binding = "CACHE"
id = "b7ca23b7839946cdb78ef7103f29ce82"

# 開發環境 R2 存儲
[[env.dev.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "multi-channel-platform-attachments-dev"

# 開發環境 Queue
[[env.dev.queues.producers]]
binding = "MESSAGE_QUEUE"
queue = "message-queue-dev"

[[env.dev.queues.consumers]]
queue = "message-queue-dev"
max_batch_size = 10
max_batch_timeout = 5