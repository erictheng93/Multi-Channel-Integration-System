# Multi-Channel Customer Support System - Unified Configuration
# Consolidates both main and WebSocket functionality
name = "multi-channel-platform"
main = "src/index.ts"
compatibility_date = "2025-10-27"
compatibility_flags = ["nodejs_compat"]

# Default production variables
[vars]
ENVIRONMENT = "production"
R2_PUBLIC_URL = "https://s3.imfinethankyouandyou.com"

# Production routes
[[routes]]
pattern = "multi-channel.imfinethankyouandyou.com/*"
zone_name = "imfinethankyouandyou.com"

# Observability
[observability]
enabled = true

# 生產環境 D1 資料庫
[[d1_databases]]
binding = "DB"
database_name = "multi-channel-platform"
database_id = "08ae6790-2494-40a8-a07a-df3920783159"
migrations_dir = "migrations"

# 生產環境 KV Namespaces
[[kv_namespaces]]
binding = "SESSIONS"
id = "ace3f7202e6a4dd8b98c50e9b91b2431"
preview_id = "ace3f7202e6a4dd8b98c50e9b91b2431"

[[kv_namespaces]]
binding = "CACHE"
id = "f3bc7a55c8a14f4fb28b8321fa01dc73"
preview_id = "f3bc7a55c8a14f4fb28b8321fa01dc73"

# 生產環境 R2 存儲
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "multi-channel-platform-attachments"
preview_bucket_name = "multi-channel-platform-attachments"

# ⚠️ REMOVED: AGENT_QUEUE has been fully deprecated and removed (2025-10-07)
# Delayed messages are now handled by DelayedMessageBuffer Durable Object
# Migration completed: 2025-09-30
# See: docs/reports/migration/MIGRATION_TO_DURABLE_OBJECTS_COMPLETE.md

# ⚠️ REMOVED: REALTIME_QUEUE has been fully deprecated and removed (Phase 2: 2025-10-17)
# Real-time events are now handled by Durable Objects (MessageBroadcaster, ConversationRoom)
# Latest message cache updates are handled by LatestMessageCacheCoordinator Durable Object
# Migration completed: Phase 1.4b (2025-10-17)

# =================== DURABLE OBJECTS (WebSocket) ===================

# ConversationRoom - Manages WebSocket connections per conversation
[[durable_objects.bindings]]
name = "CONVERSATION_ROOM"
class_name = "ConversationRoom"

# UserConnection - Manages user presence and subscriptions
[[durable_objects.bindings]]
name = "USER_CONNECTION"
class_name = "UserConnection"

# MessageBroadcaster - Intelligent event distribution and broadcasting
[[durable_objects.bindings]]
name = "MESSAGE_BROADCASTER"
class_name = "MessageBroadcaster"

# DelayedMessageScheduler - Unified delayed message scheduling with Alarm API
# Consolidates former DelayedMessageBuffer + DelayedMessageProcessor (2025-10-27)
[[durable_objects.bindings]]
name = "DELAYED_MESSAGE_SCHEDULER"
class_name = "DelayedMessageScheduler"

# DistributedLock - Cross-Durable Object coordination and locking
[[durable_objects.bindings]]
name = "DISTRIBUTED_LOCK"
class_name = "LockCoordinator"

# LatestMessageCacheCoordinator - Batch cache updates via alarm (replaces REALTIME_QUEUE)
[[durable_objects.bindings]]
name = "LATEST_MESSAGE_COORDINATOR"
class_name = "LatestMessageCacheCoordinator"

# =================== NEW: CUSTOMER CONVERSATION SYSTEM (Chat-Style) ===================
# CustomerConversationDO - Simplified WebSocket management for customer conversations
# Inspired by Chat Project's AuthorizationDurableObject
[[durable_objects.bindings]]
name = "CUSTOMER_CONVERSATION_DO"
class_name = "CustomerConversationDO"

# CustomerMessageDO - Message operations and R2 file uploads
# Inspired by Chat Project's ConversationDurableObject
[[durable_objects.bindings]]
name = "CUSTOMER_MESSAGE_DO"
class_name = "CustomerMessageDO"

# =================== DURABLE OBJECTS MIGRATIONS ===================

# Initial migration - Original Durable Objects
[[migrations]]
tag = "v1"
new_classes = [
  "ConversationRoom",
  "UserConnection",
  "MessageBroadcaster",
  "LockCoordinator"
]

# Migration v2 - Add LatestMessageCacheCoordinator (Phase 1.4b: REALTIME_QUEUE → DO)
[[migrations]]
tag = "v2"
new_classes = ["LatestMessageCacheCoordinator"]

# Migration v3 - Add delayed messaging scheduler (2025-10-27)
# Note: DelayedMessageBuffer was renamed to DelayedMessageScheduler in production
[[migrations]]
tag = "v3"
new_classes = ["DelayedMessageScheduler"]

# Migration v4 - Add Customer Conversation System (Chat-Style)
# Adds simplified WebSocket architecture for customer conversations
[[migrations]]
tag = "v4"
new_classes = [
  "CustomerConversationDO",
  "CustomerMessageDO"
]

# Development environment
[env.development]
name = "multi-channel-platform-dev"

[env.development.vars]
ENVIRONMENT = "development"
R2_PUBLIC_URL = "http://localhost:8787"

# Development resources (inherit from production but with dev IDs)
[[env.development.d1_databases]]
binding = "DB"
database_name = "multi-channel-platform-dev"
database_id = "dev-database-id-placeholder"

[[env.development.kv_namespaces]]
binding = "SESSIONS"
id = "dev-sessions-kv-placeholder"

[[env.development.kv_namespaces]]
binding = "CACHE"
id = "dev-cache-kv-placeholder"

