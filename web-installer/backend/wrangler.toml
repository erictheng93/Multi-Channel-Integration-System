name = "crm-installer-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# ========================================
# DURABLE OBJECTS CONFIGURATION
# ========================================
[durable_objects]
bindings = [
  { name = "DEPLOYMENT_ORCHESTRATOR", class_name = "DeploymentOrchestrator" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeploymentOrchestrator"]

# ========================================
# ENVIRONMENT VARIABLES
# ========================================
[vars]
# Frontend URL for CORS
FRONTEND_URL = "https://crm-installer-frontend.pages.dev"
# Environment identifier
ENVIRONMENT = "production"

# ========================================
# SECRETS (set via wrangler secret put)
# ========================================
# Required secrets (the OAuth app's redirect URI is
# https://crm-installer-frontend.pages.dev/oauth/callback):
# wrangler secret put CF_CLIENT_ID
# wrangler secret put CF_CLIENT_SECRET

# ========================================
# DEVELOPMENT CONFIGURATION
# ========================================
[dev]
port = 8787
local_protocol = "http"

# ========================================
# BUILD CONFIGURATION
# ========================================
[build]
command = ""

# Watch configuration for development
[build.upload]
format = "modules"
main = "./src/index.ts"
