<!DOCTYPE html>
<html>
<head>
    <title>事件驅動推送調試工具</title>
    <style>
        body { font-family: monospace; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; }
        .success { background: #e8f5e8; }
        .info { background: #e3f2fd; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input, select { padding: 5px; margin: 5px; }
    </style>
</head>
<body>
    <h1>🧪 事件驅動推送調試工具</h1>
    
    <div>
        <h3>📡 SSE 連接測試</h3>
        <input type="text" id="token" placeholder="JWT Token" style="width: 400px;">
        <input type="number" id="conversationId" placeholder="對話 ID" value="2">
        <button onclick="connectSSE()">建立 SSE 連接</button>
        <button onclick="disconnectSSE()">斷開連接</button>
        <div id="sseStatus">未連接</div>
    </div>
    
    <div>
        <h3>🧪 手動事件測試</h3>
        <input type="text" id="testMessage" placeholder="測試消息" value="🧪 手動測試事件">
        <button onclick="sendTestEvent()">發送測試事件</button>
    </div>
    
    <div>
        <h3>📊 連接統計</h3>
        <button onclick="getConnectionStats()">獲取連接統計</button>
    </div>
    
    <div id="logs">
        <h3>📝 實時日誌</h3>
    </div>

    <script>
        let eventSource = null;
        const apiUrl = 'https://multi-channel.imfinethankyouandyou.com/api';
        
        function log(message, type = 'info') {
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = `[${new Date().toISOString()}] ${message}`;
            document.getElementById('logs').appendChild(logDiv);
            console.log(message);
        }
        
        function connectSSE() {
            const token = document.getElementById('token').value;
            const conversationId = document.getElementById('conversationId').value;
            
            if (!token) {
                log('請輸入 JWT Token', 'error');
                return;
            }
            
            disconnectSSE();
            
            const sseUrl = `${apiUrl}/realtime/sse?conversationId=${conversationId}&token=${encodeURIComponent(token)}`;
            log(`📡 連接到: ${sseUrl}`, 'info');
            
            eventSource = new EventSource(sseUrl);
            
            eventSource.onopen = () => {
                log('✅ SSE 連接已建立', 'success');
                document.getElementById('sseStatus').textContent = '已連接';
            };
            
            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    log(`📥 收到事件: ${data.type} - ${JSON.stringify(data)}`, 'success');
                } catch (error) {
                    log(`📥 收到數據: ${event.data}`, 'info');
                }
            };
            
            eventSource.onerror = (error) => {
                log(`❌ SSE 錯誤: ${error}`, 'error');
                document.getElementById('sseStatus').textContent = '連接錯誤';
            };
        }
        
        function disconnectSSE() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
                log('🔌 SSE 連接已斷開', 'info');
                document.getElementById('sseStatus').textContent = '未連接';
            }
        }
        
        async function sendTestEvent() {
            const token = document.getElementById('token').value;
            const conversationId = document.getElementById('conversationId').value;
            const message = document.getElementById('testMessage').value;
            
            if (!token) {
                log('請輸入 JWT Token', 'error');
                return;
            }
            
            try {
                log('🧪 發送測試事件...', 'info');
                
                const response = await fetch(`${apiUrl}/realtime/test-event`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        conversationId,
                        message
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    log(`✅ 測試事件已發送: ${result.eventId}, 當前連接數: ${result.currentConnections}`, 'success');
                } else {
                    log(`❌ 測試事件失敗: ${result.error}`, 'error');
                }
                
            } catch (error) {
                log(`❌ 請求失敗: ${error.message}`, 'error');
            }
        }
        
        async function getConnectionStats() {
            const token = document.getElementById('token').value;
            const conversationId = document.getElementById('conversationId').value;
            
            if (!token) {
                log('請輸入 JWT Token', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${apiUrl}/realtime/conversation/${conversationId}/status`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    log(`📊 連接統計: ${JSON.stringify(result.data.activity, null, 2)}`, 'info');
                } else {
                    log(`❌ 獲取統計失敗: ${result.error}`, 'error');
                }
                
            } catch (error) {
                log(`❌ 請求失敗: ${error.message}`, 'error');
            }
        }
        
        // 初始化提示
        log('🎯 事件驅動推送調試工具已載入', 'info');
        log('1. 輸入 JWT Token 和對話 ID', 'info');
        log('2. 點擊「建立 SSE 連接」', 'info');
        log('3. 點擊「發送測試事件」驗證推送', 'info');
    </script>
</body>
</html>
