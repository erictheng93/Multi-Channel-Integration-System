<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加入團隊 - Multi-Channel CRM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
      padding: 2rem;
      text-align: center;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .team-info {
      display: none;
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .team-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 1rem;
      object-fit: cover;
      border: 4px solid #667eea;
    }

    .team-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 0.5rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: #f8f9fa;
      border-radius: 12px;
      margin: 1.5rem 0;
    }

    .user-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-name {
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      text-align: left;
    }

    .success-icon {
      font-size: 4rem;
      margin: 1rem 0;
    }

    .message {
      color: #666;
      margin: 1rem 0;
      line-height: 1.6;
    }

    .btn {
      background: #06C755;
      color: white;
      padding: 1rem 2rem;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #05b34d;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      display: none;
      color: #dc3545;
      padding: 1rem;
      background: #f8d7da;
      border-radius: 8px;
      margin: 1rem 0;
    }

    .countdown {
      color: #666;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Loading State -->
    <div id="loadingState" class="loading">
      <div class="spinner"></div>
      <h2>載入中...</h2>
      <p class="message">正在初始化 LINE 登入</p>
    </div>

    <!-- Team Info State -->
    <div id="teamInfoState" class="team-info">
      <img id="teamAvatar" class="team-avatar" src="" alt="Team Avatar">
      <h1 class="team-name" id="teamName">團隊名稱</h1>

      <div class="user-info">
        <img id="userAvatar" class="user-avatar" src="" alt="User Avatar">
        <div class="user-name" id="userName">載入中...</div>
      </div>

      <div class="success-icon">✅</div>
      <p class="message" id="mainMessage">
        您即將加入此團隊！點擊下方按鈕完成綁定
      </p>

      <button id="confirmBtn" class="btn">
        確認加入團隊
      </button>

      <p class="countdown" id="countdown"></p>
    </div>

    <!-- Error State -->
    <div id="errorState" class="error">
      <h3>❌ 發生錯誤</h3>
      <p id="errorMessage">請稍後再試</p>
    </div>
  </div>

  <!-- LIFF SDK — data-cfasync="false" prevents Cloudflare Rocket Loader from deferring -->
  <script data-cfasync="false" charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script data-cfasync="false">
    // 配置 - 从后端 API 获取
    let LIFF_ID = '';
    let API_BASE_URL = window.location.origin;

    // 从 URL 获取 token
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    // 状态管理
    let teamInfo = null;
    let userProfile = null;

    // DOM 元素
    const loadingState = document.getElementById('loadingState');
    const teamInfoState = document.getElementById('teamInfoState');
    const errorState = document.getElementById('errorState');
    const confirmBtn = document.getElementById('confirmBtn');
    const mainMessage = document.getElementById('mainMessage');

    // 初始化
    async function init() {
      try {
        if (!token) {
          throw new Error('缺少團隊追蹤碼');
        }

        // Step 1: 获取 LIFF 配置
        const configRes = await fetch(`${API_BASE_URL}/api/liff/config`);
        if (!configRes.ok) throw new Error('無法獲取 LIFF 配置');

        const config = await configRes.json();
        if (!config.success || !config.data) {
          throw new Error(config.error || '配置格式錯誤');
        }
        LIFF_ID = config.data.liffId;

        // Step 2: 初始化 LIFF
        await liff.init({ liffId: LIFF_ID });

        // Step 3: 检查登录状态
        if (!liff.isLoggedIn()) {
          // 未登录，跳转到 LINE 登录
          liff.login({ redirectUri: window.location.href });
          return;
        }

        // Step 4: 已登录，获取用户信息
        userProfile = await liff.getProfile();
        console.log('✅ User Profile:', {
          userId: userProfile.userId,
          displayName: userProfile.displayName
        });

        // Step 5: 获取团队信息
        const teamRes = await fetch(`${API_BASE_URL}/api/qrcode/team-info?token=${token}`);
        if (!teamRes.ok) throw new Error('無效的團隊追蹤碼');

        teamInfo = await teamRes.json();
        console.log('✅ Team Info:', teamInfo);

        // Step 6: 显示团队信息
        showTeamInfo();

      } catch (error) {
        console.error('❌ Initialization Error:', error);
        showError(error.message || '初始化失敗，請稍後再試');
      }
    }

    // 显示团队信息
    function showTeamInfo() {
      // 隐藏 loading
      loadingState.style.display = 'none';

      // 填充团队信息
      document.getElementById('teamName').textContent = teamInfo.teamName || '未知團隊';
      document.getElementById('teamAvatar').src = teamInfo.avatarUrl || 'https://via.placeholder.com/100';

      // 填充用户信息
      document.getElementById('userName').textContent = userProfile.displayName;
      document.getElementById('userAvatar').src = userProfile.pictureUrl;

      // 显示团队信息
      teamInfoState.style.display = 'block';

      // 自动倒计时 (可选)
      // startCountdown();
    }

    // 确认绑定
    confirmBtn.addEventListener('click', async () => {
      try {
        confirmBtn.disabled = true;
        confirmBtn.textContent = '綁定中...';

        // 调用后端 API 绑定
        const response = await fetch(`${API_BASE_URL}/api/qrcode/bind`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            token: token,
            userId: userProfile.userId,
            displayName: userProfile.displayName,
            pictureUrl: userProfile.pictureUrl
          })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || '綁定失敗');
        }

        const result = await response.json();
        console.log('✅ Bind Success:', result);

        // 显示成功消息 - 使用 textContent 避免 XSS
        document.querySelector('.success-icon').textContent = '🎉';
        mainMessage.textContent = `綁定成功！歡迎加入「${teamInfo.teamName}」`;
        confirmBtn.textContent = '✓ 已完成';
        confirmBtn.style.background = '#28a745';

        // 3秒后关闭 LIFF
        setTimeout(() => {
          liff.closeWindow();
        }, 3000);

      } catch (error) {
        console.error('❌ Bind Error:', error);
        confirmBtn.disabled = false;
        confirmBtn.textContent = '確認加入團隊';
        showError(error.message || '綁定失敗，請重試');
      }
    });

    // 显示错误
    function showError(message) {
      loadingState.style.display = 'none';
      teamInfoState.style.display = 'none';
      errorState.style.display = 'block';
      document.getElementById('errorMessage').textContent = message;
    }

    // 自动倒计时 (可选功能)
    function startCountdown() {
      let count = 10;
      const countdownEl = document.getElementById('countdown');

      const timer = setInterval(() => {
        count--;
        countdownEl.textContent = `⏰ ${count} 秒後自動綁定`;

        if (count <= 0) {
          clearInterval(timer);
          confirmBtn.click();
        }
      }, 1000);
    }

    // 启动应用
    init();
  </script>
</body>
</html>
