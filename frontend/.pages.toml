# Cloudflare Pages 配置檔案
# 這個檔案定義了 Pages 專案的構建和部署設定

[build]
command = "npm run build:pages"

# 環境變數配置
# ⚠️ IMPORTANT: Set these values in Cloudflare Dashboard for production
[env.production.vars]
# VITE_API_BASE_URL = "https://your-api-domain.example.com"  # Set in Dashboard
# VITE_BACKEND_URL = "https://your-api-domain.example.com"   # Set in Dashboard
# VITE_FRONTEND_URL = "https://your-frontend-domain.example.com"  # Set in Dashboard
VITE_DEV_MODE = "false"
VITE_ENABLE_DEBUG_LOGS = "false"
VITE_ENABLE_PERFORMANCE_MONITORING = "true"

[env.preview.vars]
# VITE_API_BASE_URL = "https://your-api-domain.example.com"  # Set in Dashboard
VITE_DEV_MODE = "true"
VITE_ENABLE_DEBUG_LOGS = "true"
VITE_ENABLE_PERFORMANCE_MONITORING = "false"

# 相容性設定
[compatibility]
date = "2024-01-01"
flags = []

# 函數設定
[functions]
directory = "functions"