# Cloudflare Pages 配置檔案
# 這個檔案定義了 Pages 專案的構建和部署設定

[build]
command = "npm run build:pages"
destination = "dist"

# 環境變數配置
[env.production.vars]
VITE_API_BASE_URL = "https://multi-channel.imfinethankyouandyou.com"
VITE_DEV_MODE = "false"
VITE_ENABLE_DEBUG_LOGS = "false"
VITE_ENABLE_PERFORMANCE_MONITORING = "true"

[env.preview.vars]
VITE_API_BASE_URL = "https://multi-channel.imfinethankyouandyou.com"
VITE_DEV_MODE = "true"
VITE_ENABLE_DEBUG_LOGS = "true"
VITE_ENABLE_PERFORMANCE_MONITORING = "false"

# 相容性設定
[compatibility]
date = "2024-01-01"
flags = []

# 函數設定
[functions]
directory = "functions"