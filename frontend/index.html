<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Channel Support MVP</title>

    <!-- ⚡ LCP 優化：預連接關鍵資源 -->
    <!-- API 端點預連接 - 減少 DNS 查詢和 TLS 握手時間 -->
    <!-- Note: Configure VITE_BACKEND_URL in environment for production -->
    <!-- Preconnect hints will be injected at build time if needed -->

    <!-- LINE Sticker CDN 預連接 - 加速貼圖載入 -->
    <link rel="preconnect" href="https://stickershop.line-scdn.net" crossorigin />
    <link rel="dns-prefetch" href="https://stickershop.line-scdn.net" />

    <!-- Cloudflare R2 Storage 預連接 - 加速附件載入 -->
    <link rel="dns-prefetch" href="https://pub-*.r2.dev" />

    <!-- 🎨 關鍵 CSS 內聯 - 改善 FCP 和 LCP -->
    <style>
      /* 🛡️ FOUC 防護：Vue v-cloak 指令 - 在 Vue 完全接管前隱藏內容 */
      [v-cloak] {
        display: none !important;
      }

      /* Critical CSS for initial render */
      /* Only box-sizing here. This block is unlayered, so a margin/padding reset in it would
         beat every @layer rule in style.css (.btn, .form-*, Tailwind spacing utilities) and
         zero them site-wide (#67). Tailwind preflight already resets margin/padding in @layer base. */
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; width: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f9fafb;
        color: #111827;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #app {
        height: 100vh;
        overflow: hidden;
        background-color: #f9fafb;
      }
      /* Loading skeleton animation */
      @keyframes skeleton-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      /* Only rules for the pre-mount markup below (#app > .app-loading) belong here. This block is
         unlayered and stays in the page after Vue mounts, so any app class styled here (.sidebar,
         .main-content, .stats-grid...) silently overrides the component's own CSS (#67, #70). */
      /* Initial loading state */
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 16px;
      }
      .app-loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e5e7eb;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

    </style>

    <!-- 📊 效能監控：Web Vitals 提示 -->
    <meta name="description" content="多渠道客戶支援系統 - Multi-Channel Customer Support System" />
  </head>
  <body>
    <!-- 初始載入狀態 - 在 Vue 接管前顯示 -->
    <div id="app">
      <div class="app-loading">
        <div class="app-loading-spinner"></div>
        <div style="color: #6b7280; font-size: 14px;">載入中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
