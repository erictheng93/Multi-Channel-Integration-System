<!DOCTYPE html>
<html>
<head>
    <title>Admin Login Test</title>
</head>
<body>
    <h1>Testing Admin Login</h1>
    <div id="status">Starting test...</div>
    <pre id="log"></pre>
    
    <script>
        const log = document.getElementById('log');
        const status = document.getElementById('status');
        
        function addLog(message) {
            const timestamp = new Date().toISOString();
            log.textContent += `[${timestamp}] ${message}\n`;
            console.log(message);
        }
        
        async function testLogin() {
            const credentials = {
                email: 'admin@dacit.net',
                password: '16011587DaC'
            };
            
            addLog('🔐 Testing login with credentials:');
            addLog(`   Email: ${credentials.email}`);
            addLog(`   Password length: ${credentials.password.length}`);
            
            try {
                // First, try to get the current API URL
                const apiUrl = window.location.hostname === 'localhost' 
                    ? 'http://localhost:8787' 
                    : 'https://multi-channel-integration-system.easyremember.workers.dev';
                    
                addLog(`📡 API URL: ${apiUrl}`);
                addLog('📤 Sending login request...');
                
                const response = await fetch(`${apiUrl}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(credentials)
                });
                
                addLog(`📥 Response status: ${response.status} ${response.statusText}`);
                addLog(`📥 Response headers:`);
                for (let [key, value] of response.headers) {
                    addLog(`   ${key}: ${value}`);
                }
                
                const responseText = await response.text();
                addLog(`📥 Raw response: ${responseText}`);
                
                if (response.ok) {
                    try {
                        const data = JSON.parse(responseText);
                        addLog('✅ Login successful!');
                        addLog(`📊 Response data: ${JSON.stringify(data, null, 2)}`);
                        
                        if (data.token) {
                            addLog(`🎫 Token received: ${data.token.substring(0, 20)}...`);
                            
                            // Test token validation
                            addLog('🔍 Testing token validation...');
                            const validateResponse = await fetch(`${apiUrl}/api/auth/validate`, {
                                method: 'GET',
                                headers: {
                                    'Authorization': `Bearer ${data.token}`
                                }
                            });
                            
                            const validateText = await validateResponse.text();
                            addLog(`🔍 Validation response: ${validateResponse.status} - ${validateText}`);
                            
                            if (validateResponse.ok) {
                                const validateData = JSON.parse(validateText);
                                addLog(`✅ Token is valid: ${JSON.stringify(validateData, null, 2)}`);
                            }
                        }
                        
                        status.textContent = '✅ Login test successful!';
                    } catch (e) {
                        addLog(`⚠️ Response parsing error: ${e.message}`);
                        status.textContent = '⚠️ Login succeeded but response parsing failed';
                    }
                } else {
                    addLog(`❌ Login failed with status ${response.status}`);
                    
                    try {
                        const errorData = JSON.parse(responseText);
                        addLog(`❌ Error details: ${JSON.stringify(errorData, null, 2)}`);
                        
                        if (errorData.error) {
                            addLog(`❌ Error message: ${errorData.error}`);
                        }
                        if (errorData.details) {
                            addLog(`❌ Error details: ${JSON.stringify(errorData.details, null, 2)}`);
                        }
                    } catch (e) {
                        addLog(`❌ Raw error response: ${responseText}`);
                    }
                    
                    status.textContent = `❌ Login test failed: ${response.status}`;
                }
                
            } catch (error) {
                addLog(`💥 Network or script error: ${error.message}`);
                addLog(`💥 Error stack: ${error.stack}`);
                status.textContent = `💥 Test failed with error: ${error.message}`;
            }
        }
        
        // Run test immediately
        testLogin();
    </script>
</body>
</html>
