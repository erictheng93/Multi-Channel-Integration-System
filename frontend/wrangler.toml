# Cloudflare Pages 配置
name = "multi-channel-platform-frontend"
compatibility_date = "2024-01-01"

[env.production]
# 生產環境配置
compatibility_date = "2024-01-01"

# Pages 專案設定
[build]
command = "npm run build"
cwd = "frontend"
destination = "dist"

# 環境變數 (在 Cloudflare Dashboard 中設定)
[env.production.vars]
VITE_API_BASE_URL = "https://multi-channel.imfinethankyouandyou.com"
VITE_DEV_MODE = "false"
VITE_ENABLE_DEBUG_LOGS = "false"

[env.preview.vars]
VITE_API_BASE_URL = "https://multi-channel.imfinethankyouandyou.com"
VITE_DEV_MODE = "true"
VITE_ENABLE_DEBUG_LOGS = "true"