# Cloudflare Pages 配置
name = "mcis"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

[env.production]
# 生產環境配置
compatibility_date = "2024-01-01"

# Pages 專案設定 (使用 .pages.toml 而不是此處的 build 配置)

# 環境變數 - 通過 wrangler.toml 管理
# ============================================================================
[env.production.vars]
# 核心 URL 配置
VITE_BACKEND_URL = "https://mcis-backend.daiwandist.com"
VITE_FRONTEND_URL = "https://mcis.daiwandist.com"
VITE_WEBSOCKET_URL = "wss://mcis-backend.daiwandist.com"
VITE_STORAGE_PUBLIC_URL = "https://s3.daiwandist.com"

# 環境標識
VITE_ENV = "production"
VITE_DEV_MODE = "false"

# 調試配置 (生產環境關閉)
VITE_ENABLE_DEBUG_LOGS = "false"
VITE_DEBUG = "false"
VITE_WEBSOCKET_DEBUG = "false"

# WebSocket 配置
VITE_WEBSOCKET_ENABLED = "true"
VITE_WEBSOCKET_AUTO_RECONNECT = "true"
VITE_WEBSOCKET_RECONNECT_DELAY = "3000"
VITE_WEBSOCKET_MAX_RETRIES = "10"

# 功能開關
VITE_ENABLE_SEARCH_CACHE = "true"
VITE_ENABLE_PERFORMANCE_MONITORING = "true"
VITE_ENABLE_EXPERIMENTAL_FEATURES = "false"

# ============================================================================
[env.preview.vars]
# Preview 環境使用相同的後端
VITE_BACKEND_URL = "https://mcis-backend.daiwandist.com"
VITE_FRONTEND_URL = "https://mcis.daiwandist.com"
VITE_WEBSOCKET_URL = "wss://mcis-backend.daiwandist.com"
VITE_STORAGE_PUBLIC_URL = "https://s3.daiwandist.com"

VITE_ENV = "preview"
VITE_DEV_MODE = "true"
VITE_ENABLE_DEBUG_LOGS = "true"
VITE_DEBUG = "true"
VITE_WEBSOCKET_DEBUG = "true"

VITE_WEBSOCKET_ENABLED = "true"
VITE_WEBSOCKET_AUTO_RECONNECT = "true"
VITE_WEBSOCKET_RECONNECT_DELAY = "5000"
VITE_WEBSOCKET_MAX_RETRIES = "5"

VITE_ENABLE_SEARCH_CACHE = "true"
VITE_ENABLE_PERFORMANCE_MONITORING = "true"
VITE_ENABLE_EXPERIMENTAL_FEATURES = "true"