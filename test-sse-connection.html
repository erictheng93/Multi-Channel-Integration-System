<!DOCTYPE html>
<html>
<head>
    <title>測試 SSE 連接 - Event-Driven Push</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #f0f0f0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .log { background: #f5f5f5; padding: 8px; margin: 5px 0; border-radius: 4px; font-size: 12px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        .info { background: #e3f2fd; color: #1565c0; }
        .warning { background: #fff3e0; color: #ef6c00; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-primary { background: #1976d2; color: white; }
        .btn-success { background: #388e3c; color: white; }
        .btn-danger { background: #d32f2f; color: white; }
        input { padding: 6px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .stats { background: #f9f9f9; padding: 10px; margin: 10px 0; border-left: 4px solid #2196f3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Event-Driven SSE Connection Test</h1>
        
        <div>
            <h3>📡 SSE Connection</h3>
            <input type="text" id="token" placeholder="JWT Token" style="width: 400px;" value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsInVzZXJuYW1lIjoidGVzdGFkbWluIiwicm9sZSI6ImFkbWluIiwidGVhbUlkIjoxLCJpYXQiOjE3NTQ5ODk3MzIsImV4cCI6MTc1NTA3NjEzMn0.fzb_5lYxXLUUtxGUQwLxs-q-7jzArwVyVXVaKaodJIs">
            <input type="number" id="conversationId" placeholder="對話 ID" value="2">
            <button class="btn-primary" onclick="connectSSE()">建立 SSE</button>
            <button class="btn-danger" onclick="disconnectSSE()">斷開</button>
            <div id="sseStatus" class="stats">狀態: 未連接</div>
        </div>
        
        <div>
            <h3>🧪 Test Event</h3>
            <input type="text" id="testMessage" placeholder="Test Message" value="🧪 Global SSE Manager Test">
            <button class="btn-success" onclick="sendTestEvent()">發送測試事件</button>
        </div>
        
        <div>
            <h3>📊 Connection Stats</h3>
            <button class="btn-primary" onclick="getStats()">獲取統計</button>
            <div id="statsDisplay" class="stats">點擊按鈕獲取統計信息</div>
        </div>
        
        <div>
            <h3>📝 Real-time Logs</h3>
            <button class="btn-danger" onclick="clearLogs()">清除日誌</button>
            <div id="logs"></div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let messageCount = 0;
        const apiUrl = 'https://multi-channel.imfinethankyouandyou.com/api';
        
        function log(message, type = 'info') {
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('logs').appendChild(logDiv);
            console.log(message);
            
            // Auto-scroll to bottom
            const logs = document.getElementById('logs');
            logs.scrollTop = logs.scrollHeight;
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
            messageCount = 0;
        }
        
        function connectSSE() {
            const token = document.getElementById('token').value;
            const conversationId = document.getElementById('conversationId').value;
            
            if (!token) {
                log('請輸入 JWT Token', 'error');
                return;
            }
            
            disconnectSSE();
            
            const sseUrl = `${apiUrl}/realtime/sse?conversationId=${conversationId}&token=${encodeURIComponent(token)}`;
            log(`📡 連接 SSE: ${sseUrl}`, 'info');
            
            eventSource = new EventSource(sseUrl);
            
            eventSource.onopen = () => {
                log('✅ SSE 連接成功建立', 'success');
                document.getElementById('sseStatus').innerHTML = '狀態: <strong style="color: green;">已連接</strong>';
            };
            
            eventSource.onmessage = (event) => {
                messageCount++;
                try {
                    const data = JSON.parse(event.data);
                    log(`📥 [${messageCount}] 收到事件: ${data.type}`, 'success');
                    
                    if (data.type === 'heartbeat') {
                        log(`💓 心跳: 連接數=${data.stats?.totalConnections || 0}`, 'info');
                    } else if (data.type === 'connection') {
                        log(`🔗 連接確認: ${data.connectionId}`, 'info');
                    } else if (data.type === 'message_created') {
                        log(`📨 新消息: ${data.data?.content || 'N/A'}`, 'success');
                    } else {
                        log(`📄 數據: ${JSON.stringify(data, null, 2)}`, 'info');
                    }
                } catch (error) {
                    log(`📥 [${messageCount}] 原始數據: ${event.data}`, 'info');
                }
            };
            
            eventSource.onerror = (error) => {
                log(`❌ SSE 連接錯誤: ${error.type}`, 'error');
                document.getElementById('sseStatus').innerHTML = '狀態: <strong style="color: red;">連接錯誤</strong>';
            };
        }
        
        function disconnectSSE() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
                log('🔌 SSE 連接已斷開', 'info');
                document.getElementById('sseStatus').innerHTML = '狀態: 未連接';
            }
        }
        
        async function sendTestEvent() {
            const token = document.getElementById('token').value;
            const conversationId = document.getElementById('conversationId').value;
            const message = document.getElementById('testMessage').value;
            
            if (!token) {
                log('請輸入 JWT Token', 'error');
                return;
            }
            
            try {
                log('🧪 發送測試事件...', 'warning');
                
                const response = await fetch(`${apiUrl}/realtime/test-event`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        conversationId,
                        message
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    log(`✅ 測試事件已發送: EventID=${result.data.eventId}`, 'success');
                    log(`📊 當前連接數: ${result.data.currentConnections}`, 'info');
                } else {
                    log(`❌ 測試事件失敗: ${result.error}`, 'error');
                }
                
            } catch (error) {
                log(`❌ 請求失敗: ${error.message}`, 'error');
            }
        }
        
        async function getStats() {
            const token = document.getElementById('token').value;
            const conversationId = document.getElementById('conversationId').value;
            
            if (!token) {
                log('請輸入 JWT Token', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${apiUrl}/realtime/conversation/${conversationId}/status`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const activity = result.data.activity;
                    const statsHtml = `
                        <strong>連接統計:</strong><br>
                        • SSE 連接數: ${activity.sseConnections}<br>
                        • 未讀消息: ${activity.unreadCount}<br>
                        • 打字用戶: ${activity.typingUsers.length}<br>
                        • 最後消息: ${activity.lastMessageAt || 'N/A'}
                    `;
                    document.getElementById('statsDisplay').innerHTML = statsHtml;
                    log(`📊 統計信息已更新`, 'info');
                } else {
                    log(`❌ 獲取統計失敗: ${result.error}`, 'error');
                }
                
            } catch (error) {
                log(`❌ 請求失敗: ${error.message}`, 'error');
            }
        }
        
        // 初始化
        log('🎯 Event-Driven SSE Test Tool Loaded', 'success');
        log('1. 點擊「建立 SSE」建立連接', 'info');
        log('2. 點擊「發送測試事件」測試推送', 'info');
        log('3. 觀察是否收到事件推送', 'info');
        
        // Auto-connect on load for testing
        setTimeout(() => {
            log('🔄 自動建立 SSE 連接...', 'warning');
            connectSSE();
        }, 1000);
    </script>
</body>
</html>
