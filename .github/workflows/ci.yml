name: CI - TypeScript & ESLint Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend TypeScript Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install backend dependencies
      run: npm ci
      
    - name: TypeScript compilation check
      run: npx tsc --noEmit
      
    - name: Report TypeScript errors
      if: failure()
      run: |
        echo "❌ TypeScript compilation failed!"
        echo "Please fix the TypeScript errors before merging."

  frontend-checks:
    name: Frontend TypeScript & ESLint Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: TypeScript compilation check
      run: |
        cd frontend
        npx vue-tsc --noEmit
        
    - name: ESLint check
      run: |
        cd frontend
        npm run lint -- --max-warnings 80
        
    - name: Run frontend tests
      run: |
        cd frontend
        npm test
        
    - name: Report check results
      if: failure()
      run: |
        echo "❌ Frontend checks failed!"
        echo "Please fix TypeScript errors and ESLint warnings before merging."

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    
    steps:
    - name: Quality gate passed
      run: |
        echo "✅ All quality checks passed!"
        echo "- Backend TypeScript compilation: OK"
        echo "- Frontend TypeScript compilation: OK" 
        echo "- ESLint warnings within limit: OK"
        echo "- Frontend tests: OK"