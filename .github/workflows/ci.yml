name: CI - TypeScript & ESLint Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend TypeScript Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: TypeScript compilation check
      run: bunx tsc --noEmit
      
    - name: Report TypeScript errors
      if: failure()
      run: |
        echo "❌ TypeScript compilation failed!"
        echo "Please fix the TypeScript errors before merging."

  frontend-checks:
    name: Frontend TypeScript & ESLint Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: |
        cd frontend
        bun install --frozen-lockfile

    - name: TypeScript compilation check
      run: |
        cd frontend
        bunx vue-tsc --noEmit

    - name: ESLint check
      run: |
        cd frontend
        bun run lint -- --max-warnings 80

    - name: Run frontend tests
      run: |
        cd frontend
        bun run test
        
    - name: Report check results
      if: failure()
      run: |
        echo "❌ Frontend checks failed!"
        echo "Please fix TypeScript errors and ESLint warnings before merging."

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    
    steps:
    - name: Quality gate passed
      run: |
        echo "✅ All quality checks passed!"
        echo "- Backend TypeScript compilation: OK"
        echo "- Frontend TypeScript compilation: OK" 
        echo "- ESLint warnings within limit: OK"
        echo "- Frontend tests: OK"