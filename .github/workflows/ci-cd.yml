name: CI/CD - Multi-Channel Integration System

# -----------------------------------------------------------------------------
# Triggers
# -----------------------------------------------------------------------------
# CLAUDE.md mandates "REMOTE PRODUCTION ONLY" — no staging, no develop branch.
# wrangler.toml line 234 explicitly forbids [env.staging] sections.
# Therefore this workflow targets `main` only.
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the *same PR* when new commits arrive, but never
# cancel a run that targets main (we don't want to interrupt a deploy).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to least privilege. Individual jobs widen this only if they need to.
permissions:
  contents: read

env:
  HEALTH_URL: https://mcis-backend.daiwandist.com/api/system/health
  WS_HEALTH_URL: https://mcis-backend.daiwandist.com/api/websocket/health

jobs:
  # ===========================================================================
  # 1. Validate — fast static checks (lint, types, route ordering)
  # ===========================================================================
  # Runs first as a cheap fail-fast gate. If TypeScript or lint is broken,
  # there is no point spending CI minutes on tests.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate (lint + types + routes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      # Runs: backend tsc --noEmit, frontend vue-tsc --noEmit, eslint --max-warnings 0
      - name: Lint + TypeScript (full)
        run: bun run lint:check

      # Static analysis only — safe to run anywhere, no secrets needed.
      # Catches the class of bugs documented in docs/claude/ROUTE_REGISTRATION.md.
      - name: Detect route conflicts
        run: bun run check:routes:ci

      # Defence-in-depth against SQL injection: fail the build if any new
      # `sql.raw(...)` call is introduced with a non-literal argument. The
      # only legitimate usage (analytics-reports tagJsonPath) is gated by
      # a `// eslint-disable-next-line no-unsafe-sql-raw` comment.
      - name: Check for unsafe sql.raw usage
        run: bun run check:sql-raw:ci

  # ===========================================================================
  # 1b. Schema doc freshness
  # ===========================================================================
  # docs/architecture/SCHEMA.md is generated from production's own sqlite_master
  # by scripts/generate-schema-doc.ts. Before it was generated it drifted 33
  # migrations behind reality and documented columns that no longer existed.
  # This job is what stops that happening again.
  #
  # Deliberately NOT folded into `validate`: that job is documented as
  # credential-free and safe to run anywhere, and this check needs a read-only
  # production D1 token. Keeping them separate preserves that property.
  #
  # `if: github.event_name == 'push'` means it never runs on a pull_request, so
  # the D1 token is never exposed to a fork PR. Branch protection covers main.
  #
  # The script issues three read-only SELECTs against sqlite_master and the
  # pragma table-valued functions. It never writes.
  #
  # A red result here means one of:
  #   - a migration was applied to production but the doc was not regenerated
  #   - SCHEMA.md was hand-edited (it says not to at the top)
  #   - production schema changed outside the migration pipeline
  # Fix with `bun run db:doc:schema` and commit the result.
  # ---------------------------------------------------------------------------
  schema-doc:
    name: Schema doc matches production
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Verify SCHEMA.md is up to date
        run: bun run db:doc:schema:check

  # ===========================================================================
  # 2. Backend tests
  # ===========================================================================
  # Uses the curated `test:backend:ci` script in package.json. This excludes
  # tests/e2e, tests/performance, tests/smoke and other suites that require
  # external resources (Wrangler dev server, R2, live D1).
  #
  # TODO: as more suites become CI-safe, expand the script in package.json
  # rather than this workflow — keep test selection in one source of truth.
  # ---------------------------------------------------------------------------
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NOTE: no `|| echo` swallowing — failures must fail the build.
      - name: Run backend test suite
        run: bun run test:backend:ci

  # ===========================================================================
  # 2b. Web installer backend tests
  # ===========================================================================
  # The web-installer subproject ships its own Cloudflare Workers backend
  # (Hono + Durable Object orchestrator). Its test suite uses
  # @cloudflare/vitest-pool-workers, which spins up Miniflare per file — that
  # is incompatible with the root vitest pool configuration, so we cannot
  # fold these tests into `test:backend:ci`. Instead they run as a separate
  # parallel job that depends only on `validate`.
  #
  # The suite is fully sandboxed: wrangler.test.toml hard-codes mock secrets
  # (`re_test_mock_api_key_12345`, fake encryption key, etc.) so no real
  # credentials are needed. INCLUDE_DO_TESTS=true (set inside the package's
  # test:ci script) re-enables Durable Object tests that are skipped on
  # Windows due to a Miniflare SQLite file-locking quirk; CI runs on Linux,
  # so they execute fine.
  # ---------------------------------------------------------------------------
  test-installer-backend:
    name: Web installer backend tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The script does its own `bun install --frozen-lockfile` inside
      # web-installer/backend before running vitest, so we don't pre-install
      # at the root here.
      - name: Run web installer backend test suite
        run: bun run test:installer:backend:ci

  # ===========================================================================
  # 3. Frontend tests
  # ===========================================================================
  # Runs the full Vitest suite (3,624 tests) with coverage. Uploads coverage
  # to Codecov but never blocks the build on Codecov availability.
  # ---------------------------------------------------------------------------
  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Run frontend test suite with coverage
        run: cd frontend && bun run test:run -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./frontend/coverage
          fail_ci_if_error: false
        continue-on-error: true

  # ===========================================================================
  # 4. Build verification
  # ===========================================================================
  # Builds the frontend bundle and uploads it as an artifact so the deploy
  # job can use *exactly* the bundle that was tested — never rebuild in deploy.
  # ---------------------------------------------------------------------------
  build:
    name: Build verification
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      # Verification only — CI no longer deploys (deploy-production: if: false).
      # This confirms the frontend compiles; it does NOT need production VITE_*
      # values. Production env injection + the bundle-URL guard live in the local
      # deploy path (scripts/deploy-pages.ts), where the real shipping happens.
      - name: Build frontend
        run: cd frontend && bun run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # 5. Deploy to Production
  # ===========================================================================
  # Only runs on push to main (not on PRs). Uses GitHub Environments so
  # `production` secrets and protection rules apply (consider enabling
  # required reviewers in repo settings → Environments → production).
  #
  # Order:
  #   1. Schema drift check against live D1 (defence in depth)
  #   2. Capture current worker version id (for rollback)
  #   3. Apply D1 migrations BEFORE worker deploy (forward-compatible only)
  #   4. Deploy worker
  #   5. Deploy Pages
  #   6. Health check
  #   7. Roll back worker on failure (note: D1 migrations are NOT rolled back)
  # ---------------------------------------------------------------------------
  # MANUAL DEPLOY ONLY — automatic deploy is DISABLED.
  # Production is now deployed by hand from a local machine:
  #   bun run deploy        # Worker (guarded by MCIS_CONFIRM_PRODUCTION)
  #   bun run deploy:pages  # Frontend: build -> bundle-URL guard -> wrangler pages deploy
  # push/PR to main still run validate + test + build, but nothing auto-ships.
  # The bundle-URL guard lives in the local deploy path (scripts/deploy-pages.ts),
  # not in CI. To re-enable CI deploy, restore the original `if:`:
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: false
    environment: production
    timeout-minutes: 20
    # Serialise production deploys — never cancel one in progress.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # Compares Drizzle schema (src/db/schema.ts) against live D1 columns.
      # This is the gate that would have caught the 3-day message-save outage
      # described in scripts/check-schema-drift.ts.
      - name: Schema drift check (against live D1)
        run: bun scripts/check-schema-drift.ts

      # Capture must never abort the deploy. If we can't read the current
      # deployed version (network blip, first-ever deploy, wrangler CLI change),
      # we still want to proceed — we just lose the ability to auto-roll-back.
      # The rollback step guards against this by checking for 'none'/empty.
      - name: Capture current worker version for rollback
        id: capture
        continue-on-error: true
        run: |
          set +e
          PREV=$(bunx wrangler deployments list --name mcis-worker --json 2>/dev/null | jq -r '(sort_by(.created_on) | last | .versions // [] | max_by(.percentage) | .version_id) // empty')
          if [ -z "$PREV" ]; then
            PREV="none"
          fi
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous worker version id: $PREV"

      # Migrations run BEFORE worker deploy so new code never sees old schema.
      # ASSUMPTION: every migration in drizzle/ is forward-compatible.
      # NO continue-on-error — a failed migration MUST abort the deploy.
      - name: Apply D1 migrations
        env:
          MCIS_CONFIRM_PRODUCTION: allow:d1:migrate
        run: bun run db:migrate

      - name: Deploy Worker (Cloudflare)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify

      - name: Deploy Frontend (Cloudflare Pages)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name mcis

      - name: Wait for edge propagation
        run: sleep 30

      - name: Verify production health (HTTP + WebSocket)
        run: |
          set -euo pipefail
          curl -fsSL "$HEALTH_URL"
          curl -fsSL "$WS_HEALTH_URL"

      - name: Report success
        if: success()
        run: |
          echo "Deployment successful."
          echo "Previous worker version (kept for emergency rollback): ${{ steps.capture.outputs.previous }}"

      # Rollback guard: three conditions must ALL hold.
      #   1. failure()               — some prior step failed
      #   2. previous is non-empty   — capture actually ran
      #   3. previous is not 'none'  — we have a real version id
      # If capture itself failed (output == '' or 'none'), we intentionally
      # skip rollback and let a human decide — auto-rollback with no target
      # would just crash wrangler with an empty rollback target.
      - name: Roll back worker on failure
        if: |
          failure() &&
          steps.capture.outputs.previous != '' &&
          steps.capture.outputs.previous != 'none'
        run: |
          echo "Health check or deploy failed. Rolling back worker to ${{ steps.capture.outputs.previous }}."
          bunx wrangler rollback "${{ steps.capture.outputs.previous }}" --name mcis-worker --message "Automated rollback after failed GitHub Actions deploy" --yes
          echo "WARNING: D1 migrations are NOT rolled back. Manual intervention may be required."

      - name: Flag un-rollbackable failure
        if: |
          failure() &&
          (steps.capture.outputs.previous == '' || steps.capture.outputs.previous == 'none')
        run: |
          echo "::error::Deploy failed and no rollback target was captured."
          echo "::error::Manual intervention required — check wrangler deployments list."
          exit 1
