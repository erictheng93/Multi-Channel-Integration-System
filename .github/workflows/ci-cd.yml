name: CI/CD - Multi-Channel Integration System

# -----------------------------------------------------------------------------
# Triggers
# -----------------------------------------------------------------------------
# CLAUDE.md mandates "REMOTE PRODUCTION ONLY" — no staging, no develop branch.
# wrangler.toml line 234 explicitly forbids [env.staging] sections.
# Therefore this workflow targets `main` only.
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the *same PR* when new commits arrive, but never
# cancel a run that targets main (we don't want to interrupt a deploy).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to least privilege. Individual jobs widen this only if they need to.
permissions:
  contents: read

env:
  HEALTH_URL: https://mcis-backend.daiwandist.com/api/system/health
  WS_HEALTH_URL: https://mcis-backend.daiwandist.com/api/websocket/health

jobs:
  # ===========================================================================
  # 0. Changes — decide whether this commit can change any check's result
  # ===========================================================================
  # Docs-only commits skip the pipeline. This is done with job-level `if:` and
  # NOT with workflow-level `paths-ignore`: a workflow that never triggers
  # leaves required status checks "pending" forever and blocks the PR merge,
  # whereas a job skipped by `if:` reports as skipped, which satisfies a
  # required check. The rules live in scripts/ci/classify-changes.sh.
  #
  # Fail-safe: every dependent job runs unless this job explicitly answers
  # `false`. If it fails or answers nothing, everything runs.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      schema: ${{ steps.classify.outputs.schema }}
    steps:
      # Depth 2: on a pull_request the checkout is the merge commit, whose first
      # parent is the base branch tip, so HEAD^1..HEAD is exactly the PR's diff.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/classify-changes.sh

  # ===========================================================================
  # 1. Validate — static checks (lint, types, route ordering)
  # ===========================================================================
  # Runs in parallel with the tests rather than gating them: `needs: validate`
  # passed no data, it only serialised ~70s in front of every test run.
  #
  # tsc / vue-tsc / eslint are incremental. Their caches (tsbuildinfo + the
  # content-strategy eslint cache) are restored from the latest run, so a
  # typical commit re-checks only what changed. Both verify file contents, not
  # timestamps, and no eslint rule here is type-aware, so a restored cache can
  # never hide an error; a lockfile change starts from an empty cache.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate (lint + types + routes)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Restore incremental type-check / lint caches
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/tsc-backend.tsbuildinfo
            frontend/node_modules/.cache/vue-tsc.tsbuildinfo
            frontend/node_modules/.cache/eslint/
          key: lint-${{ runner.os }}-${{ hashFiles('bun.lock', 'frontend/bun.lock') }}-${{ github.sha }}
          restore-keys: lint-${{ runner.os }}-${{ hashFiles('bun.lock', 'frontend/bun.lock') }}-

      - name: Backend TypeScript (tsc)
        run: bunx tsc --noEmit

      - name: Frontend TypeScript (vue-tsc)
        run: cd frontend && bunx vue-tsc --noEmit

      # No --fix: in CI a fixable violation must fail, not be silently fixed in
      # a throwaway checkout.
      - name: ESLint
        run: cd frontend && bunx eslint . --max-warnings 0 --cache --cache-strategy content --cache-location node_modules/.cache/eslint/

      # Static analysis only — safe to run anywhere, no secrets needed.
      # Catches the class of bugs documented in docs/claude/ROUTE_REGISTRATION.md.
      - name: Detect route conflicts
        run: bun run check:routes:ci

      # Defence-in-depth against SQL injection: fail the build if any new
      # `sql.raw(...)` call is introduced with a non-literal argument. The
      # only legitimate usage (analytics-reports tagJsonPath) is gated by
      # a `// eslint-disable-next-line no-unsafe-sql-raw` comment.
      - name: Check for unsafe sql.raw usage
        run: bun run check:sql-raw:ci

      # Every @media width must come from frontend/src/config/breakpoints.ts so
      # layouts switch at one shared set of widths instead of ad-hoc numbers.
      - name: Check responsive breakpoint scale
        run: cd frontend && bun run lint:breakpoints

      # The global .btn system must not be redefined in component styles, and a
      # modifier (.btn-primary) must always ship with the base .btn class.
      - name: Check button class system
        run: cd frontend && bun run lint:scoped-btn

      # A routed page root with max-width + auto margins and no width shrink-wraps its
      # content inside the flex-column page container (found on 10 pages).
      - name: Check page root sizing
        run: cd frontend && bun run lint:page-roots

  # ===========================================================================
  # 1b. Schema doc freshness
  # ===========================================================================
  # docs/architecture/SCHEMA.md is generated from production's own sqlite_master
  # by scripts/generate-schema-doc.ts. Before it was generated it drifted 33
  # migrations behind reality and documented columns that no longer existed.
  # This job is what stops that happening again.
  #
  # Deliberately NOT folded into `validate`: that job is documented as
  # credential-free and safe to run anywhere, and this check needs a read-only
  # production D1 token. Keeping them separate preserves that property.
  #
  # `if: github.event_name == 'push'` means it never runs on a pull_request, so
  # the D1 token is never exposed to a fork PR. Branch protection covers main.
  # It also runs on a commit that touches only SCHEMA.md (`schema` output),
  # which is exactly the commit this check exists for.
  #
  # The script issues three read-only SELECTs against sqlite_master and the
  # pragma table-valued functions. It never writes.
  #
  # A red result here means one of:
  #   - a migration was applied to production but the doc was not regenerated
  #   - SCHEMA.md was hand-edited (it says not to at the top)
  #   - production schema changed outside the migration pipeline
  # Fix with `bun run db:doc:schema` and commit the result.
  # ---------------------------------------------------------------------------
  schema-doc:
    name: Schema doc matches production
    needs: changes
    if: github.event_name == 'push' && !cancelled() && needs.changes.outputs.schema != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Verify SCHEMA.md is up to date
        run: bun run db:doc:schema:check

  # ===========================================================================
  # 2. Backend tests
  # ===========================================================================
  # Uses the curated `test:backend:ci` script in package.json. This excludes
  # tests/e2e, tests/performance and other suites that require external
  # resources (Wrangler dev server, R2, live D1), which is why that script may
  # run files in parallel even though vitest.config.ts defaults to serial.
  #
  # TODO: as more suites become CI-safe, expand the script in package.json
  # rather than this workflow — keep test selection in one source of truth.
  # ---------------------------------------------------------------------------
  test-backend:
    name: Backend tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No `cache:` here: setup-node caches npm/yarn/pnpm stores only, and this
      # repo installs with Bun. Node is needed only as Vitest's runtime.
      - name: Setup Node (Vitest 5 needs >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NOTE: no `|| echo` swallowing — failures must fail the build.
      - name: Run backend test suite
        run: bun run test:backend:ci

  # ===========================================================================
  # 3. Frontend tests — sharded across machines
  # ===========================================================================
  # The longest suite (~170s on one runner), split by Vitest's --shard into
  # three parallel jobs. Each shard uploads its own coverage; Codecov merges
  # uploads for the same commit. (frontend/vitest.config.ts's thresholds are
  # under a Jest-style `global` key that Vitest ignores, so coverage is
  # reported, not enforced — sharding changes nothing there.)
  # ---------------------------------------------------------------------------
  test-frontend-shard:
    name: Frontend tests (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let every shard finish so one red run lists all failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (Vitest 5 needs >=22.12)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Frontend only: frontend/ has its own lockfile and shared/ imports no
      # packages, so the root install was ~5s of unused work per job.
      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Run frontend test suite with coverage
        run: cd frontend && bun run test:run -- --coverage --shard=${{ matrix.shard }}/3

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./frontend/coverage
          fail_ci_if_error: false
        continue-on-error: true

  # One stable check name for the sharded suite, so a branch-protection rule
  # on "Frontend tests" keeps working and the shard count can change freely.
  # It must not be skipped when a shard fails (a skipped job satisfies a
  # required check), hence `!cancelled()` instead of the implicit success().
  test-frontend:
    name: Frontend tests
    needs: [changes, test-frontend-shard]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All frontend shards passed
        env:
          RESULT: ${{ needs.test-frontend-shard.result }}
        run: |
          echo "Frontend shards: $RESULT"
          test "$RESULT" = success

  # ===========================================================================
  # 4. Build verification
  # ===========================================================================
  # Builds the frontend bundle and uploads it as an artifact so the deploy
  # job can use *exactly* the bundle that was tested — never rebuild in deploy.
  # Runs in parallel with the tests: it consumes nothing they produce.
  # ---------------------------------------------------------------------------
  build:
    name: Build verification
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Frontend only, as in the test shards.
      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      # Verification only — CI no longer deploys (deploy-production: if: false).
      # This confirms the frontend compiles; it does NOT need production VITE_*
      # values. Production env injection + the bundle-URL guard live in the local
      # deploy path (scripts/deploy-pages.ts), where the real shipping happens.
      #
      # `vite build` directly, not `bun run build` (= vue-tsc && vite build):
      # vue-tsc already runs in `validate`, so running it here was the same
      # ~20s of work done twice.
      - name: Build frontend
        run: cd frontend && bunx vite build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # 5. Deploy to Production
  # ===========================================================================
  # Only runs on push to main (not on PRs). Uses GitHub Environments so
  # `production` secrets and protection rules apply (consider enabling
  # required reviewers in repo settings → Environments → production).
  #
  # Order:
  #   1. Schema drift check against live D1 (defence in depth)
  #   2. Capture current worker version id (for rollback)
  #   3. Apply D1 migrations BEFORE worker deploy (forward-compatible only)
  #   4. Deploy worker
  #   5. Deploy Pages
  #   6. Health check
  #   7. Roll back worker on failure (note: D1 migrations are NOT rolled back)
  # ---------------------------------------------------------------------------
  # MANUAL DEPLOY ONLY — automatic deploy is DISABLED.
  # Production is now deployed by hand from a local machine:
  #   bun run deploy        # Worker (guarded by MCIS_CONFIRM_PRODUCTION)
  #   bun run deploy:pages  # Frontend: build -> bundle-URL guard -> wrangler pages deploy
  # push/PR to main still run validate + test + build, but nothing auto-ships.
  # The bundle-URL guard lives in the local deploy path (scripts/deploy-pages.ts),
  # not in CI. To re-enable CI deploy, restore the original `if:`:
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Every gate, listed explicitly: build no longer waits for the tests, so
    # `needs: build` alone would let a re-enabled deploy ship untested code.
    needs: [validate, test-backend, test-frontend, build]
    if: false
    environment: production
    timeout-minutes: 20
    # Serialise production deploys — never cancel one in progress.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # Compares Drizzle schema (src/db/schema.ts) against live D1 columns.
      # This is the gate that would have caught the 3-day message-save outage
      # described in scripts/check-schema-drift.ts.
      - name: Schema drift check (against live D1)
        run: bun scripts/check-schema-drift.ts

      # Capture must never abort the deploy. If we can't read the current
      # deployed version (network blip, first-ever deploy, wrangler CLI change),
      # we still want to proceed — we just lose the ability to auto-roll-back.
      # The rollback step guards against this by checking for 'none'/empty.
      - name: Capture current worker version for rollback
        id: capture
        continue-on-error: true
        run: |
          set +e
          PREV=$(bunx wrangler deployments list --name mcis-worker --json 2>/dev/null | jq -r '(sort_by(.created_on) | last | .versions // [] | max_by(.percentage) | .version_id) // empty')
          if [ -z "$PREV" ]; then
            PREV="none"
          fi
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous worker version id: $PREV"

      # Migrations run BEFORE worker deploy so new code never sees old schema.
      # ASSUMPTION: every migration in drizzle/ is forward-compatible.
      # NO continue-on-error — a failed migration MUST abort the deploy.
      - name: Apply D1 migrations
        env:
          MCIS_CONFIRM_PRODUCTION: allow:d1:migrate
        run: bun run db:migrate

      - name: Deploy Worker (Cloudflare)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify

      - name: Deploy Frontend (Cloudflare Pages)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name mcis

      - name: Wait for edge propagation
        run: sleep 30

      - name: Verify production health (HTTP + WebSocket)
        run: |
          set -euo pipefail
          curl -fsSL "$HEALTH_URL"
          curl -fsSL "$WS_HEALTH_URL"

      - name: Report success
        if: success()
        run: |
          echo "Deployment successful."
          echo "Previous worker version (kept for emergency rollback): ${{ steps.capture.outputs.previous }}"

      # Rollback guard: three conditions must ALL hold.
      #   1. failure()               — some prior step failed
      #   2. previous is non-empty   — capture actually ran
      #   3. previous is not 'none'  — we have a real version id
      # If capture itself failed (output == '' or 'none'), we intentionally
      # skip rollback and let a human decide — auto-rollback with no target
      # would just crash wrangler with an empty rollback target.
      - name: Roll back worker on failure
        if: |
          failure() &&
          steps.capture.outputs.previous != '' &&
          steps.capture.outputs.previous != 'none'
        run: |
          echo "Health check or deploy failed. Rolling back worker to ${{ steps.capture.outputs.previous }}."
          bunx wrangler rollback "${{ steps.capture.outputs.previous }}" --name mcis-worker --message "Automated rollback after failed GitHub Actions deploy" --yes
          echo "WARNING: D1 migrations are NOT rolled back. Manual intervention may be required."

      - name: Flag un-rollbackable failure
        if: |
          failure() &&
          (steps.capture.outputs.previous == '' || steps.capture.outputs.previous == 'none')
        run: |
          echo "::error::Deploy failed and no rollback target was captured."
          echo "::error::Manual intervention required — check wrangler deployments list."
          exit 1
