name: D1 Backup

# Automated recurring backup of the production D1 database (mcis-db).
# Runs OFF the production worker (zero risk to the live app) using wrangler's
# proven `d1 export`, then stores copies in independent places.
#
# WHAT IS BACKED UP each run:
#   • Full DB dump            -> R2 mcis-backups/daily/  (and monthly/ on the 1st)
#   • Platform members only   -> R2 mcis-backups/members/  (agents + teams +
#                                agent_teams — the /team page; small + most critical
#                                = access control. Also inside the full dump, but
#                                kept separately for fast, targeted restore.)
#   • Off-Cloudflare copy     -> GitHub Actions artifact (survives an account teardown)
#
# RETENTION (Grandfather-Father-Son) — enforced by R2 lifecycle rules set in the
# dashboard (R2 -> mcis-backups -> Settings -> Object lifecycle rules):
#   • prefix "daily/"   -> delete after  30 days
#   • prefix "monthly/" -> delete after 365 days
#   • prefix "members/" -> delete after 365 days
#   (GitHub artifacts: 90 days, set below.)
#
# Context: created after the 2026-06-17 incident where production D1 was deleted
# with no backup. Requires repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# (already used by ci-cd.yml) with D1:read + R2:write. Test via "Run workflow".

on:
  schedule:
    - cron: '0 19 * * *' # 19:00 UTC = 03:00 Asia/Taipei daily (low-traffic window)
  workflow_dispatch: {} # allow manual run for testing

permissions:
  contents: read

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies (wrangler)
        run: bun install --frozen-lockfile

      - name: Export D1 — full dump + members
        run: |
          STAMP="$(date -u +%Y-%m-%d)"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"
          echo "DOM=$(date -u +%d)" >> "$GITHUB_ENV"
          # full database (schema + all data)
          bunx wrangler d1 export mcis-db --remote --output "mcis-db-${STAMP}.sql"
          # platform members only (the /team page): access-control tables
          bunx wrangler d1 export mcis-db --remote --table agents --table teams --table agent_teams --output "members-${STAMP}.sql"
          echo "Sizes:"; ls -la "mcis-db-${STAMP}.sql" "members-${STAMP}.sql"
          # sanity checks: dumps must contain data, not just schema
          if ! grep -qi 'INSERT INTO' "mcis-db-${STAMP}.sql"; then
            echo "::error::Full backup contains no INSERT statements — aborting."; exit 1
          fi
          if ! grep -qi 'INSERT INTO' "members-${STAMP}.sql"; then
            echo "::error::Members backup contains no rows — aborting."; exit 1
          fi

      - name: Upload full dump to R2 (daily)
        run: bunx wrangler r2 object put "mcis-backups/daily/mcis-db-${STAMP}.sql" --file="mcis-db-${STAMP}.sql" --remote

      - name: Upload full dump to R2 (monthly snapshot)
        if: env.DOM == '01'
        run: bunx wrangler r2 object put "mcis-backups/monthly/mcis-db-${STAMP}.sql" --file="mcis-db-${STAMP}.sql" --remote

      - name: Upload members to R2
        run: bunx wrangler r2 object put "mcis-backups/members/members-${STAMP}.sql" --file="members-${STAMP}.sql" --remote

      - name: Off-Cloudflare copy (GitHub artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mcis-db-backup-${{ env.STAMP }}
          path: |
            mcis-db-*.sql
            members-*.sql
          retention-days: 90
