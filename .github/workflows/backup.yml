name: D1 Backup

# Automated recurring backup of the production D1 database (mcis-db).
# Runs OFF the production worker (zero risk to the live app) using wrangler's
# proven `d1 export`, then stores gzip-compressed copies in R2.
#
# WHAT IS BACKED UP each run (all gzip -9, key suffix .sql.gz):
#   • Full DB dump            -> R2 mcis-backups/daily/  (and monthly/ on the 1st)
#   • Platform members only   -> R2 mcis-backups/members/  (agents + teams +
#                                agent_teams = Staff Management + Team Settings)
#   • Customer tags only      -> R2 mcis-backups/tags/  (tags + customer_tags +
#                                conversation_tags = /tags Customer Tag management)
#   • Team assignments only   -> R2 mcis-backups/assignments/  (conversations +
#                                customer_team_assignments + conversation_transfers
#                                = which team each conversation/customer is assigned to)
#   The focused dumps are also inside the full dump; kept separately for fast,
#   targeted restore of small, critical config/routing data.
#
# NO GITHUB ARTIFACT (removed 2026-10-12): this repo is PUBLIC, and artifacts of
# a public repo are downloadable by any GitHub user. The dumps contain customer
# conversations and agent credentials, so they must never be uploaded there.
# Consequence: until an off-Cloudflare copy is added (private S3-compatible
# storage), every copy lives in the same Cloudflare account. Do not re-add
# actions/upload-artifact for these files.
#
# RETENTION (Grandfather-Father-Son) — enforced by R2 lifecycle rules on the
# mcis-backups bucket (`wrangler r2 bucket lifecycle list mcis-backups`):
#   • prefix "daily/"       -> delete after  30 days
#   • prefix "monthly/"     -> delete after 365 days
#   • prefix "members/"     -> delete after 365 days
#   • prefix "tags/"        -> delete after 365 days
#   • prefix "assignments/" -> delete after 365 days
#   • prefix "manual/"      -> delete after  90 days (in-app button, plain .sql)
#
# Full runbook: docs/operations/BACKUP_AND_RESTORE.md
# Context: created after the 2026-06-17 incident where production D1 was deleted
# with no backup. Requires repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# (already used by ci-cd.yml) with D1:read + R2:write. Test via "Run workflow".

on:
  schedule:
    - cron: '0 19 * * *' # 19:00 UTC = 03:00 Asia/Taipei daily (low-traffic window)
  workflow_dispatch: {} # allow manual run for testing

permissions:
  contents: read

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies (wrangler)
        run: bun install --frozen-lockfile

      - name: Export D1 — full dump + focused snapshots
        run: |
          STAMP="$(date -u +%Y-%m-%d)"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"
          echo "DOM=$(date -u +%d)" >> "$GITHUB_ENV"
          # full database (schema + all data)
          bunx wrangler d1 export mcis-db --remote --output "mcis-db-${STAMP}.sql"
          # platform members (Staff Management + Team Settings)
          bunx wrangler d1 export mcis-db --remote --table agents --table teams --table agent_teams --output "members-${STAMP}.sql"
          # customer tags (may be empty)
          bunx wrangler d1 export mcis-db --remote --table tags --table customer_tags --table conversation_tags --output "tags-${STAMP}.sql"
          # conversation/customer team assignments (may be empty until teams exist)
          bunx wrangler d1 export mcis-db --remote --table conversations --table customer_team_assignments --table conversation_transfers --output "assignments-${STAMP}.sql"
          echo "Sizes:"; ls -la mcis-db-${STAMP}.sql members-${STAMP}.sql tags-${STAMP}.sql assignments-${STAMP}.sql
          # sanity: full + members must contain rows (agents always exist)
          if ! grep -qi 'INSERT INTO' "mcis-db-${STAMP}.sql"; then
            echo "::error::Full backup contains no INSERT statements — aborting."; exit 1
          fi
          if ! grep -qi 'INSERT INTO' "members-${STAMP}.sql"; then
            echo "::error::Members backup contains no rows — aborting."; exit 1
          fi
          # tags / assignments may have no rows yet; warn (do not abort)
          grep -qi 'INSERT INTO' "tags-${STAMP}.sql" || echo "::warning::Tags backup has no rows (no customer tags defined yet)."
          grep -qi 'INSERT INTO' "assignments-${STAMP}.sql" || echo "::warning::Assignments backup has no team-assignment rows yet."

      - name: Compress dumps (gzip -9) and verify
        run: |
          gzip -9 -f "mcis-db-${STAMP}.sql" "members-${STAMP}.sql" "tags-${STAMP}.sql" "assignments-${STAMP}.sql"
          for f in mcis-db-${STAMP}.sql.gz members-${STAMP}.sql.gz tags-${STAMP}.sql.gz assignments-${STAMP}.sql.gz; do
            gzip -t "$f"
          done
          ls -la *-${STAMP}.sql.gz

      - name: Upload full dump to R2 (daily)
        run: bunx wrangler r2 object put "mcis-backups/daily/mcis-db-${STAMP}.sql.gz" --file="mcis-db-${STAMP}.sql.gz" --content-type=application/gzip --remote

      - name: Upload full dump to R2 (monthly snapshot)
        if: env.DOM == '01'
        run: bunx wrangler r2 object put "mcis-backups/monthly/mcis-db-${STAMP}.sql.gz" --file="mcis-db-${STAMP}.sql.gz" --content-type=application/gzip --remote

      - name: Upload members to R2
        run: bunx wrangler r2 object put "mcis-backups/members/members-${STAMP}.sql.gz" --file="members-${STAMP}.sql.gz" --content-type=application/gzip --remote

      - name: Upload tags to R2
        run: bunx wrangler r2 object put "mcis-backups/tags/tags-${STAMP}.sql.gz" --file="tags-${STAMP}.sql.gz" --content-type=application/gzip --remote

      - name: Upload assignments to R2
        run: bunx wrangler r2 object put "mcis-backups/assignments/assignments-${STAMP}.sql.gz" --file="assignments-${STAMP}.sql.gz" --content-type=application/gzip --remote
