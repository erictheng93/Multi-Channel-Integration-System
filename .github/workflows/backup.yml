name: D1 Backup

# Automated recurring backup of the production D1 database (mcis-db).
# Runs OFF the production worker (zero risk to the live app) using wrangler's
# proven `d1 export`, then stores copies in two independent places:
#   1. R2 bucket "mcis-backups" (Tier 1 — fast restore, but same Cloudflare account)
#   2. GitHub Actions artifact (Tier 2 — OFF the Cloudflare account = real isolation)
#
# Context: created after the 2026-06-17 incident where the production D1 was
# deleted with no backup. See docs / memory for the full recovery.
#
# NOTE: requires the repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# (already used by ci-cd.yml) to ALSO have D1:read (export) and R2:write (object put)
# permissions. If the existing token is scoped only to Workers, broaden it or add a
# dedicated backup token. Test once via the "Run workflow" (workflow_dispatch) button.

on:
  schedule:
    - cron: '0 19 * * *' # 19:00 UTC = 03:00 Asia/Taipei daily (low-traffic window)
  workflow_dispatch: {} # allow manual run for testing

permissions:
  contents: read

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies (wrangler)
        run: bun install --frozen-lockfile

      - name: Export D1 (schema + data)
        run: |
          STAMP="$(date -u +%Y-%m-%d)"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"
          echo "DOM=$(date -u +%d)" >> "$GITHUB_ENV"
          bunx wrangler d1 export mcis-db --remote --output "mcis-db-${STAMP}.sql"
          echo "Backup size:"; ls -la "mcis-db-${STAMP}.sql"
          # sanity check: dump must contain data, not just schema
          if ! grep -qi 'INSERT INTO' "mcis-db-${STAMP}.sql"; then
            echo "::error::Backup contains no INSERT statements — aborting."; exit 1
          fi

      - name: Upload to R2 (daily)
        run: bunx wrangler r2 object put "mcis-backups/daily/mcis-db-${STAMP}.sql" --file="mcis-db-${STAMP}.sql" --remote

      - name: Upload to R2 (monthly snapshot, kept long-term)
        if: env.DOM == '01'
        run: bunx wrangler r2 object put "mcis-backups/monthly/mcis-db-${STAMP}.sql" --file="mcis-db-${STAMP}.sql" --remote

      - name: Off-Cloudflare copy (GitHub artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mcis-db-backup-${{ env.STAMP }}
          path: mcis-db-*.sql
          retention-days: 90
