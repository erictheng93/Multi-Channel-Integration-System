version: 2
updates:
  # Each sub-project has its own lockfile, so each needs its own entry.
  # Dependabot opens PRs only; nothing is merged or deployed automatically.
  - package-ecosystem: bun
    directories: ["/", "/frontend", "/web-installer/frontend"]
    schedule:
      interval: weekly
    groups:
      wrangler:
        patterns: ["wrangler"]
      # vitest and its coverage/ui packages must share a major; bump them together.
      vitest:
        patterns: ["vitest", "@vitest/*"]
    open-pull-requests-limit: 5
    ignore:
      # TS 7 replaces the compiler API; vue-tsc 3.x and scripts/check-sql-raw break on it.
      # Drop this once vue-tsc and typescript-eslint support TS 7.
      - dependency-name: typescript
        versions: [">=7"]

  # web-installer/backend runs tests in the Workers pool, whose peer range is vitest ^4.1
  # (@cloudflare/vitest-pool-workers 0.23). Drop the ignore once the pool supports vitest 5.
  - package-ecosystem: bun
    directory: "/web-installer/backend"
    schedule:
      interval: weekly
    groups:
      wrangler:
        patterns: ["wrangler"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
