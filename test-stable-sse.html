<!DOCTYPE html>
<html>
<head>
    <title>🔧 SSE連接穩定性測試</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; font-weight: bold; }
        .connected { background: #e8f5e8; color: #2e7d32; }
        .disconnected { background: #ffebee; color: #c62828; }
        .connecting { background: #fff3e0; color: #ef6c00; }
        .log { background: #f9f9f9; padding: 6px; margin: 3px 0; border-radius: 3px; font-size: 12px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        .info { background: #e3f2fd; color: #1565c0; }
        .heartbeat { background: #f3e5f5; color: #7b1fa2; }
        button { padding: 10px 16px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #1976d2; color: white; }
        .btn-success { background: #388e3c; color: white; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-warning { background: #f57c00; color: white; }
        input { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 10px 0; }
        .stat-card { background: #f9f9f9; padding: 10px; border-radius: 4px; text-align: center; }
        .stat-number { font-size: 24px; font-weight: bold; color: #1976d2; }
        .logs-container { max-height: 400px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 SSE連接穩定性測試工具</h1>
        <p><strong>目的：</strong>測試改進後的SSE連接穩定性，驗證事件驅動推送系統</p>
        
        <div class="status disconnected" id="connectionStatus">
            🔴 未連接
        </div>
        
        <div>
            <h3>🔧 連接設定</h3>
            <input type="text" id="token" placeholder="JWT Token" style="width: 500px;" 
                   value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiJhZG1pbi0wMDEiLCJkaXNwbGF5TmFtZSI6IkRlYnVnIFVzZXIiLCJyb2xlIjoiYWRtaW4iLCJ0ZWFtSWQiOjEsImlhdCI6MTc1NzQ4NDM4OSwiZXhwIjoxNzU3NTcwNzg5fQ.kl1qiTvHfzGJ77V3vVLchs_HYJRan6SBMl_rWzPvXYs">
            <input type="number" id="conversationId" placeholder="對話ID" value="2">
            <button class="btn-primary" onclick="connectSSE()">🔗 建立 SSE 連接</button>
            <button class="btn-danger" onclick="disconnectSSE()">🔌 斷開連接</button>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="messageCount">0</div>
                <div>總接收消息</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="heartbeatCount">0</div>
                <div>心跳消息</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="uptime">0s</div>
                <div>連接時間</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="reconnectCount">0</div>
                <div>重連次數</div>
            </div>
        </div>
        
        <div>
            <h3>🧪 測試功能</h3>
            <input type="text" id="testMessage" placeholder="測試消息內容" value="🔧 SSE穩定性測試消息">
            <button class="btn-success" onclick="sendTestEvent()">📤 發送測試事件</button>
            <button class="btn-warning" onclick="generateNewToken()">🔑 生成新Token</button>
            <button class="btn-danger" onclick="clearLogs()">🗑️ 清除日誌</button>
        </div>
        
        <div>
            <h3>📝 實時日誌</h3>
            <div class="logs-container" id="logs">
                <div class="log info">🎯 SSE穩定性測試工具已載入</div>
                <div class="log info">💡 改進項目：8秒心跳、優化標頭、錯誤處理、全域SSE管理器</div>
            </div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let messageCount = 0;
        let heartbeatCount = 0;
        let reconnectCount = 0;
        let connectionStartTime = null;
        let uptimeInterval = null;
        const apiUrl = 'https://multi-channel.imfinethankyouandyou.com/api';
        
        function log(message, type = 'info') {
            const logDiv = document.createElement('div');
            logDiv.className = `log ${type}`;
            logDiv.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('logs').appendChild(logDiv);
            
            // Auto-scroll
            const logs = document.getElementById('logs');
            logs.scrollTop = logs.scrollHeight;
            
            console.log(`[${type}] ${message}`);
        }
        
        function updateStatus(status, className) {
            const statusDiv = document.getElementById('connectionStatus');
            statusDiv.textContent = status;
            statusDiv.className = `status ${className}`;
        }
        
        function updateStats() {
            document.getElementById('messageCount').textContent = messageCount;
            document.getElementById('heartbeatCount').textContent = heartbeatCount;
            document.getElementById('reconnectCount').textContent = reconnectCount;
        }
        
        function startUptimeCounter() {
            connectionStartTime = Date.now();
            uptimeInterval = setInterval(() => {
                if (connectionStartTime) {
                    const uptime = Math.floor((Date.now() - connectionStartTime) / 1000);
                    document.getElementById('uptime').textContent = `${uptime}s`;
                }
            }, 1000);
        }
        
        function stopUptimeCounter() {
            if (uptimeInterval) {
                clearInterval(uptimeInterval);
                uptimeInterval = null;
            }
            connectionStartTime = null;
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
            messageCount = 0;
            heartbeatCount = 0;
            reconnectCount = 0;
            updateStats();
            log('📋 日誌已清除', 'info');
        }
        
        function connectSSE() {
            const token = document.getElementById('token').value;
            const conversationId = document.getElementById('conversationId').value;
            
            if (!token) {
                log('❌ 請輸入 JWT Token', 'error');
                return;
            }
            
            disconnectSSE(); // 清理舊連接
            updateStatus('🟡 正在連接...', 'connecting');
            log('🔗 正在建立 SSE 連接...', 'info');
            
            const sseUrl = `${apiUrl}/realtime/sse?conversationId=${conversationId}&token=${encodeURIComponent(token)}`;
            
            eventSource = new EventSource(sseUrl);
            
            eventSource.onopen = () => {
                updateStatus('🟢 已連接', 'connected');
                log('✅ SSE 連接成功建立', 'success');
                startUptimeCounter();
                
                if (reconnectCount > 0) {
                    log(`🔄 重連成功 (第${reconnectCount}次)`, 'success');
                }
            };
            
            eventSource.onmessage = (event) => {
                messageCount++;
                
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'heartbeat') {
                        heartbeatCount++;
                        log(`💓 心跳 #${heartbeatCount} (連接數: ${data.stats?.totalConnections || 0})`, 'heartbeat');
                    } else if (data.type === 'connection') {
                        log(`🔗 連接確認: ${data.connectionId}`, 'success');
                    } else if (data.type === 'message_created') {
                        log(`📨 新消息事件: ${data.data?.content || 'N/A'}`, 'success');
                    } else if (data.type === 'connection_closed') {
                        log(`🔴 連接關閉事件: ${data.reason}`, 'error');
                    } else {
                        log(`📦 事件: ${data.type} - ${JSON.stringify(data).substring(0, 100)}...`, 'info');
                    }
                } catch (error) {
                    log(`📥 原始數據: ${event.data.substring(0, 200)}`, 'info');
                }
                
                updateStats();
            };
            
            eventSource.onerror = (error) => {
                log(`❌ SSE 連接錯誤: ${error.type}`, 'error');
                updateStatus('🔴 連接錯誤', 'disconnected');
                stopUptimeCounter();
                
                // 自動重連邏輯
                if (eventSource && eventSource.readyState === EventSource.CLOSED) {
                    reconnectCount++;
                    updateStats();
                    log(`🔄 連接已關閉，準備重連 (${reconnectCount})`, 'info');
                    
                    setTimeout(() => {
                        if (!eventSource || eventSource.readyState === EventSource.CLOSED) {
                            log('🔄 開始自動重連...', 'info');
                            connectSSE();
                        }
                    }, 3000);
                }
            };
        }
        
        function disconnectSSE() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
                updateStatus('🔴 已斷開', 'disconnected');
                log('🔌 SSE 連接已手動斷開', 'info');
                stopUptimeCounter();
            }
        }
        
        async function sendTestEvent() {
            const token = document.getElementById('token').value;
            const conversationId = document.getElementById('conversationId').value;
            const message = document.getElementById('testMessage').value;
            
            if (!token) {
                log('❌ 請輸入 JWT Token', 'error');
                return;
            }
            
            try {
                log('📤 發送測試事件...', 'info');
                
                const response = await fetch(`${apiUrl}/realtime/test-event`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        conversationId,
                        message
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    log(`✅ 測試事件已發送: ${result.eventId}`, 'success');
                    log(`📊 當前連接數: ${result.currentConnections}`, 'info');
                } else {
                    log(`❌ 測試事件失敗: ${result.error}`, 'error');
                }
                
            } catch (error) {
                log(`❌ 發送失敗: ${error.message}`, 'error');
            }
        }
        
        async function generateNewToken() {
            try {
                log('🔑 生成新的測試token...', 'info');
                
                const response = await fetch(`${apiUrl}/debug/generate-token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('token').value = result.token;
                    log(`✅ 新token已生成，過期時間: ${new Date(result.expiresAt).toLocaleString()}`, 'success');
                } else {
                    log(`❌ Token生成失敗: ${result.error}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Token生成失敗: ${error.message}`, 'error');
            }
        }
        
        // 頁面載入時自動連接
        window.addEventListener('load', () => {
            log('🚀 頁面載入完成，準備測試SSE穩定性', 'info');
            
            // 自動連接
            setTimeout(() => {
                log('🔄 自動建立連接進行測試...', 'info');
                connectSSE();
            }, 1000);
        });
        
        // 頁面卸載時清理
        window.addEventListener('beforeunload', () => {
            disconnectSSE();
        });
    </script>
</body>
</html>
